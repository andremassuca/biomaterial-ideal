[package]
name = "mcdm-wasm"
version = "0.1.0"
edition = "2021"
description = "Versão web da aplicação Biomaterial Ideal: o núcleo mcdm compilado para WebAssembly, com os mesmos pedidos dos comandos Tauri"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcdm = { path = "../mcdm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
