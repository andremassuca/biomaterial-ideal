[package]
name = "mcdm"
version = "0.1.0"
edition = "2021"
description = "Núcleo de cálculo da aplicação Biomaterial Ideal: TOPSIS, WASPAS e VIKOR com critérios-alvo, Borda, Monte Carlo e perfis de doente"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
