<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biomaterial Ideal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica o tema guardado antes do primeiro desenho, para não piscar.
      (function () {
        try {
          var t = localStorage.getItem("biomat.tema") || "sistema";
          var escuro = t === "escuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
        } catch (e) {
          document.documentElement.dataset.tema = "claro";
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
